[project]
name = "marketplace-uplift-auction"
version = "0.1.0"
description = "Simulated three-sided marketplace with ground-truth causal effects for uplift modeling and ad auction experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "causalml>=0.15",
    "dowhy>=0.13",
    "econml>=0.16",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "mlflow>=2.16",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    # Spark 4.x required: this repo runs on Java 17/21 (3.5.x does not support Java 21)
    "pyspark>=4.0,<4.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mua"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
