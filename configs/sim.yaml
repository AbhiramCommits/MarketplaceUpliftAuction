# Simulation configuration. Everything is driven by a single seed.
seed: 42

n_days: 30
n_consumers: 50000
n_merchants: 5000
n_dashers: 800
target_rows: 2000000
small_rows: 50000
city_size_km: 10.0

treatment:
  target_share: 0.35
  # Logistic propensity coefficients. The intercept is calibrated automatically
  # so the mean propensity equals target_share.
  coefficients:
    price_sensitivity: 1.2
    is_new_user: 0.9
    historical_ctr: 1.0
    is_peak: 0.35

paths:
  raw_impressions: data/raw/impressions
  raw_consumers: data/raw/consumers
  raw_merchants: data/raw/merchants
  raw_dashers: data/raw/dashers
  truth: data/truth
