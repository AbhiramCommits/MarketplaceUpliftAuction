# Ads auction simulation configuration.
paths:
  scored: data/scored
  auction_runs: data/auction_runs
  figures: reports/figures

auction:
  mechanism: gsp            # first_price | second_price | gsp | vcg
  rounds: 200000
  seed: 42
  slate_size: 20
  slot_positions: [1, 2, 3] # sponsored slots within the 20-item slate (max 3)
  reserve: 0.5
  agent_mix:
    truthful: 0.4
    shading: 0.2
    paced: 0.3
    random: 0.1
  shading:
    initial: 0.8
    step: 0.02
    min: 0.3
    max: 1.0
  pacing:
    learning_rate: 0.3
    lam_max: 10.0
    budget_ratio: 0.5   # daily budget = value x pctr x rounds x participation x ratio
